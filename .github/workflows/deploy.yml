name: Deploy Smart City Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Konfigurasi permissions untuk GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Batasi hanya 1 deployment yang berjalan bersamaan
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Arahkan ke folder web/ tempat file index.html berada
          path: './web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
