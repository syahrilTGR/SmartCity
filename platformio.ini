; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ==============================================================================
; PANDUAN CEPAT COMMAND UPLOAD & MONITOR (Tinggal Copas ke Terminal):
; ==============================================================================
; Firmware Utama      : pio run -e esp32dev -t upload && pio device monitor
; Test Optocoupler    : pio run -e test_opto -t upload && pio device monitor
; Test Sensor IR      : pio run -e test_ir -t upload && pio device monitor
; Test Simulator BNC  : pio run -e test_bnc -t upload && pio device monitor
; Test Sensor LDR     : pio run -e test_ldr -t upload && pio device monitor
; Test Saklar Toggle  : pio run -e test_toggle -t upload && pio device monitor
; ==============================================================================

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps = 
    tzapu/WiFiManager @ ^2.0.17

; ------------------------------------------------------------------------------
; 1. FIRMWARE UTAMA SMART CITY TERINTEGRASI (Seluruh Subsistem Diorama)
; Command: pio run -e esp32dev -t upload && pio device monitor
; ------------------------------------------------------------------------------
[env:esp32dev]
build_src_filter = -<*> +<main.cpp>

; ------------------------------------------------------------------------------
; 2. UJI SENSOR PANEL SURYA (Optocoupler PC817 + Traffic Light VKS)
; Command: pio run -e test_opto -t upload && pio device monitor
; ------------------------------------------------------------------------------
[env:test_opto]
build_src_filter = -<*> +<test_opto.cpp>

; ------------------------------------------------------------------------------
; 3. UJI SENSOR IR PROXIMITY 1 & 2 (LPJ Jalur Atas)
; Command: pio run -e test_ir -t upload && pio device monitor
; ------------------------------------------------------------------------------
[env:test_ir]
build_src_filter = -<*> +<test_ir.cpp>

; ------------------------------------------------------------------------------
; 4. UJI SIMULATOR BNC SERI & PARALEL (LPJ Jalur Bawah)
; Command: pio run -e test_bnc -t upload && pio device monitor
; ------------------------------------------------------------------------------
[env:test_bnc]
build_src_filter = -<*> +<test_bnc.cpp>

; ------------------------------------------------------------------------------
; 5. UJI SENSOR CAHAYA LDR (Siang / Malam & Lampu Rumah)
; Command: pio run -e test_ldr -t upload && pio device monitor
; ------------------------------------------------------------------------------
[env:test_ldr]
build_src_filter = -<*> +<test_ldr.cpp>

; ------------------------------------------------------------------------------
; 6. UJI SAKLAR TOGGLE SENSOR (Master Enable Otomasi)
; Command: pio run -e test_toggle -t upload && pio device monitor
; ------------------------------------------------------------------------------
[env:test_toggle]
build_src_filter = -<*> +<test_toggle.cpp>



